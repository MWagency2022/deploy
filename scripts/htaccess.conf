# Genere par le moteur de deploiement MW Agency.
# Pour le personnaliser, placer un .htaccess dans public/ du projet :
# il sera alors conserve tel quel.

<IfModule mod_rewrite.c>
  RewriteEngine On

  # HTTPS obligatoire
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !https
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

  # Routes profondes : servir index.html si le fichier n existe pas.
  # Les fichiers reels (assets, api/contact.php) restent servis normalement.
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteCond %{REQUEST_URI} !^/api/
  RewriteRule . /index.html [L]
</IfModule>

<IfModule mod_deflate.c>
  AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript
  AddOutputFilterByType DEFLATE application/javascript application/json
  AddOutputFilterByType DEFLATE application/xml image/svg+xml
</IfModule>

# Les assets portent une empreinte dans leur nom : cache long sans risque.
# Le HTML ne doit jamais etre mis en cache, sinon les mises a jour
# n apparaissent pas chez les visiteurs deja venus.
<IfModule mod_expires.c>
  ExpiresActive On
  ExpiresByType text/css                "access plus 1 year"
  ExpiresByType application/javascript  "access plus 1 year"
  ExpiresByType image/png               "access plus 1 year"
  ExpiresByType image/jpeg              "access plus 1 year"
  ExpiresByType image/webp              "access plus 1 year"
  ExpiresByType image/svg+xml           "access plus 1 year"
  ExpiresByType font/woff2              "access plus 1 year"
  ExpiresByType text/html               "access plus 0 seconds"
</IfModule>

<IfModule mod_headers.c>
  <FilesMatch "\.(html)$">
    Header set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "SAMEORIGIN"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

<FilesMatch "^\.(env|git).*">
  Require all denied
</FilesMatch>

# Le marqueur d identite ne doit pas etre public
<Files ".mw-site.json">
  Require all denied
</Files>

Options -Indexes
